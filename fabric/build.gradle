plugins {
	id 'java'
	id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}"
}

repositories {
	maven { url "https://maven.terraformersmc.com/releases/" }
}

// Optional renderer mods are useful for runClient, but they are not build-time
// dependencies of Mob Health Indicators. Keeping them out of plain `build`
// makes releases reproducible even when a third-party download service is down.
def includeRenderMods = providers.gradleProperty("includeRenderMods")
        .map { it.toBoolean() }
        .orElse(gradle.startParameter.taskNames.any { it.toLowerCase().contains("runclient") })
        .get()

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"

    runtimeOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    if (includeRenderMods) {
        runtimeOnly "net.caffeinemc:sodium-fabric:${project.sodium_version}"
        runtimeOnly "maven.modrinth:iris:${project.iris_version}-fabric"
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.classtweaker")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

    runs {
        client {
            runDir = "../run"
            ideConfigGenerated = true
            client()
        }
    }
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)

    def props = [version: project.mod_version]
    inputs.properties(props)

    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version
    }
}

tasks.named("check") {
    dependsOn "validateAccessWidener"
}
