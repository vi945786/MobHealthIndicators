plugins {
	id 'java'
	id 'net.neoforged.moddev' version "${neoforge_gradle_version}"
}

neoForge {
    version = project.neoforge_loader_version

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    validateAccessTransformers = true

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            gameDirectory = project.file("../run")
            client()
        }
    }
}

repositories {
    maven {
        name = "NeoForged"
        url = uri("https://maven.neoforged.net/releases")
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${project.neoforge_loader_version}"
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}"

    runtimeOnly "maven.modrinth:sodium:${project.sodium_version}-neoforge"
    runtimeOnly "maven.modrinth:iris:${project.iris_version}-neoforge"
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)

    inputs.property "version", project.mod_version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.mod_version
    }
}
