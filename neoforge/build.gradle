plugins {
	id 'java'
	id 'net.neoforged.moddev' version "${neoforge_gradle_version}"
}

neoForge {
    version = project.neoforge_loader_version

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    validateAccessTransformers = true

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            gameDirectory = project.file("../run")
            client()
        }
    }
}

repositories {
    maven {
        name = "NeoForged"
        url = uri("https://maven.neoforged.net/releases")
    }
}

// Sodium and Iris are optional compatibility-test dependencies, not required
// to compile or package the mod. They are enabled automatically for runClient
// and can be forced for another task with -PincludeRenderMods=true.
def includeRenderMods = providers.gradleProperty("includeRenderMods")
        .map { it.toBoolean() }
        .orElse(gradle.startParameter.taskNames.any { it.toLowerCase().contains("runclient") })
        .get()

dependencies {
    implementation "net.neoforged:neoforge:${project.neoforge_loader_version}"
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}"

    if (includeRenderMods) {
        runtimeOnly "net.caffeinemc:sodium-neoforge-mod:${project.sodium_version}"
        runtimeOnly "maven.modrinth:iris:${project.iris_version}-neoforge"
    }
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)

    inputs.property "version", project.mod_version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.mod_version
    }
}
